name: Claude PR Review

# Revisa PRs y comenta. NO hace merge: el merge lo controlan las reglas de protección
# de rama (CI verde + aprobación humana) o el auto-merge nativo de GitHub.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, develop]
  # Permite pedir ayuda con "@claude ..." en comentarios de PR
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Solo PRs del propio repo (los forks no reciben secretos), y no borradores
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request siguiendo CLAUDE.md y AGENTS.md del repositorio.
            Concéntrate solo en lo que cambió en el diff. Verifica antes de afirmar
            (lee los archivos reales, no supongas).

            Prioriza, en este orden:
            1. Bugs de correctitud y manejo de errores.
            2. Seguridad: JWT/cookies, CSRF, RBAC, ownership de bookings, nunca PAN/CVV.
            3. Arquitectura hexagonal: `domain/` sin imports de Spring/JPA; controllers
               llaman puertos de entrada, no repositorios; sin dependencias entre
               `backend/` y `audit-service/`.
            4. Tests faltantes para el comportamiento nuevo.
            5. Frontend: componentes standalone con Signals, `apiBase()` para URLs.

            Ignora estilo y preferencias menores. No repitas lo que ya cubre CI.
            Comenta en línea con `mcp__github_inline_comment__create_inline_comment`
            solo los hallazgos reales, y termina con un comentario resumen corto:
            veredicto (OK / Cambios necesarios) y los puntos clave.
            Responde en español.
          claude_args: |
            --max-turns 12
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  # Respuesta a menciones "@claude" (solo colaboradores con permiso de escritura)
  assist:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 15
