name: Qodana

# Qodana Community es gratis y no requiere token ni Qodana Cloud.
# Se ejecuta manualmente o al hacer push a main (no en cada PR) para no gastar minutos.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'audit-service/backend/**'
      - 'qodana.yaml'

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.2
        with:
          pr-mode: false
          use-caches: true
          upload-result: true
          # Sin QODANA_TOKEN: el reporte queda como artefacto del workflow
