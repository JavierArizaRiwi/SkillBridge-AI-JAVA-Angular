name: skillbridge-ai
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridge}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5433:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridge}
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
    - skillbridge
  redis:
    image: redis:8-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
    - skillbridge
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    ports:
    - 127.0.0.1:15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 8s
      timeout: 5s
      retries: 20
    networks:
    - skillbridge
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillbridge}
      DATABASE_USER: ${POSTGRES_USER:-skillbridge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_dev}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-at-least-32-characters}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://localhost:8090,http://localhost:4200}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      NOTIFICATIONS_SENDER: ${NOTIFICATIONS_SENDER:-simulated}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-no-reply@skillbridge.local}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
    - 127.0.0.1:8080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/actuator/health/liveness | grep -q UP
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
    - skillbridge
  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 8088:80
    networks:
    - skillbridge
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
    - observability
    volumes:
    - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - skillbridge
  grafana:
    image: grafana/grafana:12.1.1
    profiles:
    - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - grafana_data:/var/lib/grafana
    - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
    - prometheus
    networks:
    - skillbridge
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
    - kafka_data:/var/lib/kafka/data
    ports:
    - 127.0.0.1:9092:9092
    healthcheck:
      test:
      - CMD
      - kafka-topics
      - --bootstrap-server
      - localhost:9092
      - --list
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
    - skillbridge
  audit-backend:
    build:
      context: ./audit-service/backend
    environment:
      PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:4200}
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/liveness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - skillbridge
  audit-frontend:
    build:
      context: ./audit-service/frontend
    depends_on:
      audit-backend:
        condition: service_healthy
    ports:
      - 8090:80
    networks:
      - skillbridge
  mailpit:
    image: axllent/mailpit
    ports:
      - 127.0.0.1:8025:8025
    networks:
      - skillbridge
networks:
  skillbridge:
    driver: bridge
volumes:
  postgres_data: null
  redis_data: null
  rabbitmq_data: null
  grafana_data: null
  kafka_data: null
